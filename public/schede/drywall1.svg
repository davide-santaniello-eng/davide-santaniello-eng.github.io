<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <marker id="arrow-start" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M9,0 L0,3 L9,6 z" fill="#284B63" />
    </marker>
    <marker id="arrow-end" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 z" fill="#284B63" />
    </marker>
  </defs>

  <g stroke="#284B63" stroke-width="1.5" fill="#f1f5f9">
    <!-- Panel layout -->
    <rect x="80" y="50" width="60" height="150" />
    <rect x="80" y="200" width="60" height="40" />

    <rect x="140" y="50" width="60" height="30" />
    <rect x="140" y="80" width="60" height="160" />

    <rect x="200" y="50" width="60" height="150" />
    <rect x="200" y="200" width="60" height="40" />
    
    <rect x="260" y="50" width="40" height="30" />
    <rect x="260" y="80" width="40" height="160" />
  </g>

  <g stroke="#284B63" stroke-width="1" fill="none">
    <!-- H measure -->
    <line x1="40" y1="50" x2="40" y2="200" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
    <line x1="30" y1="50" x2="80" y2="50" />
    <line x1="30" y1="200" x2="80" y2="200" />
    
    <!-- Y measure -->
    <line x1="320" y1="50" x2="320" y2="240" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
    <line x1="300" y1="50" x2="340" y2="50" />
    <line x1="300" y1="240" x2="340" y2="240" />

    <!-- Z measure -->
    <line x1="80" y1="30" x2="140" y2="30" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
    <line x1="80" y1="10" x2="80" y2="50" />
    <line x1="140" y1="10" x2="140" y2="50" />

    <!-- X measure -->
    <line x1="80" y1="260" x2="300" y2="260" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
    <line x1="80" y1="240" x2="80" y2="280" />
    <line x1="300" y1="240" x2="300" y2="280" />
  </g>

  <g font-family="sans-serif" font-weight="bold" font-size="16" fill="#284B63">
    <text x="20" y="130">H</text>
    <text x="330" y="150">Y</text>
    <text x="105" y="20">Z</text>
    <text x="185" y="285">X</text>
  </g>
</svg>
